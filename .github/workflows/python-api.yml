name: Python API CI

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/python-api.yml"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/python-api.yml"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omilinks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omilinks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omilinks_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Verify migration state
        run: python manage.py migrate --check

      - name: Run tests
        run: python manage.py test
