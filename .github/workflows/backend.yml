name: Backend CI

on:
  push:
    paths:
      - "packages/backend/**"
      - "packages/typescript-config/**"
      - "packages/eslint-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  pull_request:
    paths:
      - "packages/backend/**"
      - "packages/typescript-config/**"
      - "packages/eslint-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnilinks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @workspace/backend lint

      - name: Typecheck
        run: pnpm --filter @workspace/backend typecheck

      - name: Test (memory and PostgreSQL stores)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omnilinks_test
        run: pnpm --filter @workspace/backend test

      - name: Build
        run: pnpm --filter @workspace/backend build
