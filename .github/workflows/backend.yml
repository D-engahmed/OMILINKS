name: Legacy Convex Compatibility

# Transitional only: new backend capabilities belong in services/api.
# Keep this job to a typecheck of the existing Convex integration until its
# frontend callers and data have completed the documented Django cutover.

on:
  push:
    paths:
      - "packages/backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  pull_request:
    paths:
      - "packages/backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

jobs:
  legacy-convex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck transitional Convex package
        run: pnpm --filter @workspace/backend typecheck
