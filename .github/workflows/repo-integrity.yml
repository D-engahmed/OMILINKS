name: Repository Integrity

# Keep the transitional Convex package and the target Python API from being
# removed by docs-only changes without the repository integrity check noticing.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify transitional Convex package
        run: |
          if [ ! -f packages/backend/package.json ]; then
            echo "::error file=packages/backend/package.json::The transitional Convex package is still required by current frontend callers."
            exit 1
          fi
          echo "Transitional Convex package is present."

      - name: Verify target Django API
        run: |
          if [ ! -f services/api/pyproject.toml ] || [ ! -f services/api/manage.py ]; then
            echo "::error file=services/api/pyproject.toml::The target Django API foundation is missing."
            exit 1
          fi
          echo "Django API foundation is present."
