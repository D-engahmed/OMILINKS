[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omilinks-api"
version = "0.1.0"
description = "OmniLinks customer operations API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django==6.1.3",
  "djangorestframework==3.18.3",
  "dj-database-url>=3.0,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.14,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "modules*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
