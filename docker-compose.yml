# OmniLinks local development infrastructure (OML-T0006).
#
#   docker compose up --build -d postgres api
#   docker compose exec api python manage.py migrate
#
# Reset: docker compose down -v && docker compose up --build -d postgres api
#         then run the migration command above.
# Redis is intentionally absent: no consumer needs it yet (leases, queues,
# and deduplication are PostgreSQL-backed). Add it when a cache or
# rate-limit consumer lands, not before.

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omnilinks
      POSTGRES_PASSWORD: omnilinks
      POSTGRES_DB: omnilinks
    volumes:
      - omnilinks-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnilinks"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-key-do-not-use-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,api}
      DATABASE_URL: postgresql://omnilinks:omnilinks@postgres:5432/omnilinks
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live/', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  omnilinks-postgres:
